[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
process_name=%(program_name)s
command=php /var/www/html/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
; Redis may still be loading its dataset when the container starts, and
; Horizon exits immediately on "LOADING" errors. Supervisor waits one second
; longer before each retry, so 20 retries cover about three and a half
; minutes instead of the default three retries in a few seconds.
startretries=20
; Must stay below the php service's stop_grace_period in docker-compose.yml,
; otherwise Docker kills Horizon before it finishes shutting down.
stopwaitsecs=60
stopasgroup=true
killasgroup=true

[program:scheduler]
process_name=%(program_name)s
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
startretries=20
stopasgroup=true
killasgroup=true
